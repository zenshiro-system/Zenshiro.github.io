<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | Root Access</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow: hidden;
            font-size: 16px;
        }
        #terminal {
            max-width: 900px;
            margin: 0 auto;
        }
        .line {
            margin: 10px 0;
            line-height: 1.5;
            text-shadow: 0 0 5px #00ff00;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00ff00;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #input-line {
            display: flex;
            align-items: center;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            width: 100%;
            text-shadow: 0 0 5px #00ff00;
            margin-left: 10px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line" class="hidden">
            <span id="prompt-text">> Hazır mısın? (Evet/Hayır): </span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const inputLine = document.getElementById('input-line');
        const userInput = document.getElementById('user-input');

        // İşletim sistemini tespit etme
        function getOS() {
            let userAgent = window.navigator.userAgent;
            if (userAgent.indexOf("Windows") !== -1) return "Windows_PC";
            if (userAgent.indexOf("Mac") !== -1) return "MacOS_Makinesi";
            if (userAgent.indexOf("Linux") !== -1) return "Linux_Sistemi";
            if (userAgent.indexOf("Android") !== -1) return "Android_Cihaz";
            if (userAgent.indexOf("iPhone") !== -1) return "iPhone_Cihaz";
            return "Bilinmeyen_Sistem";
        }

        async function typeText(text, delay = 35) {
            const line = document.createElement('div');
            line.className = 'line';
            output.appendChild(line);

            for (let i = 0; i < text.length; i++) {
                line.textContent += text.charAt(i);
                window.scrollTo(0, document.body.scrollHeight);
                await new Promise(resolve => setTimeout(resolve, delay));
            }
            return line;
        }

        async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // Ekran Çatlaması ve Kapanması (Cracked Screen) Efekti
        function startCrackedScreen() {
            document.body.innerHTML = ""; // Mevcut terminali sil
            document.body.style.margin = "0";
            document.body.style.padding = "0";
            document.body.style.backgroundColor = "#050505";
            
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.style.zIndex = '9999';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d', { alpha: true });
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Çatlakları çiz
            function drawCrack(x, y, segments, branchProbability) {
                ctx.beginPath();
                ctx.moveTo(x, y);
                let currentX = x;
                let currentY = y;
                for (let i = 0; i < segments; i++) {
                    const length = Math.random() * 20 + 10;
                    const angle = Math.random() * Math.PI * 2;
                    currentX += Math.cos(angle) * length;
                    currentY += Math.sin(angle) * length;
                    ctx.lineTo(currentX, currentY);
                    if (Math.random() < branchProbability && i < segments - 2) {
                        drawCrack(currentX, currentY, segments - i - 1, branchProbability * 0.5);
                    }
                }
                ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.stroke();
            }

            // Birkaç impact noktası
            for (let i = 0; i < 3; i++) {
                const impactX = Math.random() * canvas.width;
                const impactY = Math.random() * canvas.height;
                drawCrack(impactX, impactY, 20, 0.4);
            }
            
            // İsteğe bağlı: Cam kırılma sesi (Hacker filmi hissi için)
            // const shatterSound = new Audio('https://www.soundjay.com/break-glass-1.mp3'); 
            // shatterSound.play(); 

            // 3 saniye sonra ekranı tamamen karart ve sekmeyi kapatmayı dene
            setTimeout(() => {
                document.body.innerHTML = "";
                document.body.style.backgroundColor = "black";
                // canvas.parentNode.removeChild(canvas); // Canvas'ı kaldır
                window.close();
            }, 3000);
        }

        async function startSequence() {
            let ip = "127.0.0.1";
            let os = getOS();

            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ip = data.ip;
            } catch (error) {
                ip = "IP_Bulunamadi";
            }

            await typeText(`root@${os}[${ip}]:~# hedef_sistem_taranıyor...`);
            await wait(600);
            await typeText(`> ${ip} adresli hedefe güvenli kanal açıldı. [GİZLİ]`);
            await wait(800);
            await typeText("> Cihaz kimliği doğrulanıyor... BAŞARILI.");
            await wait(1000);
            
            inputLine.classList.remove('hidden');
            userInput.focus();
        }

        userInput.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const answer = this.value.trim().toLowerCase();
                inputLine.classList.add('hidden');
                
                const echo = document.createElement('div');
                echo.className = 'line';
                echo.textContent = "> Hazır mısın? (Evet/Hayır): " + answer;
                output.appendChild(echo);

                if (answer === 'evet' || answer === 'e') {
                    await wait(500);
                    await typeText("> Yetki onaylandı. Veritabanına giriş yapılıyor...");
                    await wait(1000);
                    await typeText("--------------------------------------------------");
                    await typeText("SİSTEM İPUCU: Hedef dosyalar güncellendi.");
                    await typeText("Görev: Teo De Luca profilini ve bağlantılarını incele.");
                    await typeText("Şifreleme Türü: SHA-256");
                    await typeText("--------------------------------------------------");
                    await typeText("> Beklemede kalın..._");
                } 
                else if (answer === 'hayır' || answer === 'h') {
                    await wait(500);
                    await typeText("> İşlem reddedildi. Güvenlik protokolü devreye giriyor...");
                    await wait(1000);
                    await typeText("> İZİNSİZ GİRİŞ GİRİŞİMİ TESPİT EDİLDİ!");
                    await wait(500);
                    await typeText("> Bağlantı zorla KESİLİYOR...");
                    await wait(1000);
                    
                    // EKRA ÇATLAMASI VE KAPANMASI EFEKTİNİ BAŞLAT
                    startCrackedScreen();
                } 
                else {
                    await wait(500);
                    await typeText("> HATA: Geçersiz komut algılandı. Sistem kilitleniyor.");
                    await wait(800);
                    document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%; font-family:Courier New;'>Kritik Hata: SİSTEM KİLİTLENDİ</h1>";
                }
            }
        });

        window.onload = startSequence;
        
        document.body.addEventListener('click', () => {
            if(!inputLine.classList.contains('hidden')) { userInput.focus(); }
        });
    </script>
</body>
</html>
