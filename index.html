<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | Root Access</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            font-size: 16px;
        }
        #terminal {
            max-width: 900px;
            margin: 0 auto;
        }
        .line {
            margin: 5px 0;
            line-height: 1.3;
            text-shadow: 0 0 5px #00ff00;
            word-wrap: break-word;
        }
        .error-line {
            color: #ff3333;
            text-shadow: 0 0 5px #ff0000;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00ff00;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            width: 100%;
            text-shadow: 0 0 5px #00ff00;
            margin-left: 10px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line" class="hidden">
            <span id="prompt-text">> Hazır mısın? (Evet/Hayır): </span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const inputLine = document.getElementById('input-line');
        const userInput = document.getElementById('user-input');

        function getOS() {
            let userAgent = window.navigator.userAgent;
            if (userAgent.indexOf("Windows") !== -1) return "Windows_PC";
            if (userAgent.indexOf("Mac") !== -1) return "MacOS_Makinesi";
            if (userAgent.indexOf("Linux") !== -1) return "Linux_Sistemi";
            if (userAgent.indexOf("Android") !== -1) return "Android_Cihaz";
            if (userAgent.indexOf("iPhone") !== -1) return "iPhone_Cihaz";
            return "Bilinmeyen_Sistem";
        }

        function generateRandomIP() {
            const octet1 = Math.floor(Math.random() * (223 - 10 + 1)) + 10;
            const octet2 = Math.floor(Math.random() * 256);
            const octet3 = Math.floor(Math.random() * 256);
            const octet4 = Math.floor(Math.random() * (254 - 1 + 1)) + 1;
            return `${octet1}.${octet2}.${octet3}.${octet4}`;
        }

        async function typeText(text, delay = 40, isError = false) {
            const line = document.createElement('div');
            line.className = 'line';
            if (isError) line.classList.add('error-line');
            output.appendChild(line);

            for (let i = 0; i < text.length; i++) {
                line.textContent += text.charAt(i);
                window.scrollTo(0, document.body.scrollHeight);
                await new Promise(resolve => setTimeout(resolve, delay));
            }
            return line;
        }

        async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // HAYIR DENDİĞİNDE ÇALIŞAN DOSYA AKIŞI (HATA HATA) EFEKTİ
        function startFileDump() {
            let fileExtensions = ['.sys', '.dll', '.dat', '.bin', '.so', '.exe', '.cfg', '.log', '.enc', '.key'];
            let filePrefixes = ['kernel', 'system', 'config', 'user', 'data', 'module', 'network', 'security', 'cache', 'root'];
            
            let dumpInterval = setInterval(() => {
                const line = document.createElement('div');
                line.className = 'line error-line';
                
                let files = "";
                for(let i=0; i<3; i++) { 
                    let pre = filePrefixes[Math.floor(Math.random() * filePrefixes.length)];
                    let ext = fileExtensions[Math.floor(Math.random() * fileExtensions.length)];
                    let id = Math.floor(Math.random() * 99999).toString().padStart(5, '0');
                    files += `DELETING: /sys/core/${pre}_${id}${ext} ... [FAILED]   `;
                }
                
                line.textContent = files;
                output.appendChild(line);
                window.scrollTo(0, document.body.scrollHeight);
            }, 30); 

            setTimeout(() => {
                clearInterval(dumpInterval);
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #050505; margin: 0;">
                        <h1 style="color: #ff0000; text-align: center; font-family: 'Courier New', Courier, monospace; font-size: 4rem; text-shadow: 0 0 20px #ff0000; animation: blink 0.5s infinite;">
                            ERROR ERROR<br>
                            <span style="font-size: 2rem;">CRITICAL SYSTEM FAILURE</span>
                        </h1>
                    </div>
                `;
                setTimeout(() => window.close(), 2500);
            }, 3000);
        }

        // YANLIŞ CEVAP YAZILDIĞINDA ÇALIŞAN KURUKAFA VE FLICKER EFEKTİ
        function startSkullGlitch() {
            document.body.innerHTML = `
                <div id="skull-box" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #000; overflow: hidden;">
                    <pre id="skull-art" style="color: #ff0000; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 15px #ff0000; text-align: center; line-height: 1.1;">
       ______
    .-"      "-.
   /            \\
  |              |
  |,  .-.  .-.  ,|
  | )(__/  \\__)( |
  |/     /\\     \\|
  (_     ^^     _)
   \\__|IIIIII|__/
    | \\IIIIII/ |
    \\          /
     \`--------\`
                    </pre>
                    <h1 style="color: #ff0000; font-family: 'Courier New', monospace; font-size: 3rem; text-shadow: 0 0 20px #ff0000; margin-top: 20px; text-align: center;">SİSTEM KİLİTLENDİ</h1>
                </div>
            `;
            
            let isRed = false;
            let skullBox = document.getElementById('skull-box');
            let skullArt = document.getElementById('skull-art');
            
            // Ekranın çılgın gibi kırmızı/siyah gidip gelmesi
            let flickerInterval = setInterval(() => {
                if (isRed) {
                    skullBox.style.backgroundColor = "#000000";
                    skullArt.style.color = "#ff0000";
                    skullArt.style.transform = "translate(3px, -3px)";
                } else {
                    skullBox.style.backgroundColor = "#330000"; // Koyu kırmızı arka plan
                    skullArt.style.color = "#ffffff"; // Beyaz kurukafa
                    skullArt.style.transform = "translate(-3px, 3px) scale(1.1)"; // Hafif büyüyüp titreme
                }
                isRed = !isRed;
            }, 50); // Saniyede 20 kez renk değiştirir

            // 3 saniye sonra tamamen karart ve sekmeyi kapat
            setTimeout(() => {
                clearInterval(flickerInterval);
                document.body.innerHTML = "";
                document.body.style.backgroundColor = "black";
                window.close();
            }, 3000);
        }

        async function startSequence() {
            let ip = generateRandomIP(); 
            let os = getOS();

            await typeText(`root@${os}[${ip}]:~# hedef_sistem_taranıyor...`);
            await wait(600);
            await typeText(`> ${ip} adresli hedefe güvenli kanal açıldı. [GİZLİ]`);
            await wait(800);
            await typeText("> Cihaz kimliği doğrulanıyor... BAŞARILI.");
            await wait(1000);
            
            inputLine.classList.remove('hidden');
            userInput.focus();
        }

        userInput.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const answer = this.value.trim().toLowerCase();
                inputLine.classList.add('hidden');
                
                const echo = document.createElement('div');
                echo.className = 'line';
                echo.textContent = "> Hazır mısın? (Evet/Hayır): " + answer;
                output.appendChild(echo);

                if (answer === 'evet' || answer === 'e') {
                    // EVET SENARYOSU (Gizli Görev)
                    await wait(500);
                    await typeText("> Yetki onaylandı. Şifreli protokole geçiliyor...");
                    await wait(1000);
                    await typeText("--------------------------------------------------");
                    await typeText("KOD ADI: Zenshiro");
                    await wait(500);
                    await typeText("GÖREV: Çevreni dikkatle incele. 'Tilki' kod adlı ajanı tespit et. Unutma, şu an en yakınındaki kişi bile senin için bir tehdit olabilir. Hiçbir şeye güvenme, kimseye belli etme.");
                    await wait(500);
                    await typeText("ŞİFRELEME: **** (Sistem Dışı Müdahaleye Kapalı)");
                    await typeText("--------------------------------------------------");
                    await wait(800);
                    await typeText("> Görevi yapın, sizinle iletişime geçilecek..._");
                } 
                else if (answer === 'hayır' || answer === 'h') {
                    // HAYIR SENARYOSU (Veri silinme ve ERROR ERROR)
                    await wait(500);
                    await typeText("> İşlem reddedildi. Güvenlik protokolü devreye giriyor...", 35, true);
                    await wait(800);
                    await typeText("> İZİNSİZ GİRİŞ GİRİŞİMİ TESPİT EDİLDİ!", 20, true);
                    await wait(500);
                    await typeText("> SİSTEM VERİLERİ SİLİNİYOR...", 35, true);
                    await wait(800);
                    startFileDump();
                } 
                else {
                    // YANLIŞ CEVAP SENARYOSU (Kurukafa ve Ekranın çıldırması)
                    await wait(500);
                    await typeText("> HATA: Geçersiz komut algılandı...", 35, true);
                    await wait(500);
                    await typeText("> SİSTEM KİLİTLENİYOR!", 20, true);
                    await wait(800);
                    startSkullGlitch();
                }
            }
        });

        window.onload = startSequence;
        
        document.body.addEventListener('click', () => {
            if(!inputLine.classList.contains('hidden')) { userInput.focus(); }
        });
    </script>
</body>
</html>
