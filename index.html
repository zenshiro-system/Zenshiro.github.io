<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | Root Access</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow: hidden;
            font-size: 16px;
        }
        #terminal {
            max-width: 900px;
            margin: 0 auto;
        }
        .line {
            margin: 10px 0;
            line-height: 1.5;
            text-shadow: 0 0 5px #00ff00;
        }
        .error-line {
            color: #ff3333;
            text-shadow: 0 0 5px #ff0000;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00ff00;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #input-line {
            display: flex;
            align-items: center;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            width: 100%;
            text-shadow: 0 0 5px #00ff00;
            margin-left: 10px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line" class="hidden">
            <span id="prompt-text">> Hazır mısın? (Evet/Hayır): </span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const inputLine = document.getElementById('input-line');
        const userInput = document.getElementById('user-input');

        function getOS() {
            let userAgent = window.navigator.userAgent;
            if (userAgent.indexOf("Windows") !== -1) return "Windows_PC";
            if (userAgent.indexOf("Mac") !== -1) return "MacOS_Makinesi";
            if (userAgent.indexOf("Linux") !== -1) return "Linux_Sistemi";
            if (userAgent.indexOf("Android") !== -1) return "Android_Cihaz";
            if (userAgent.indexOf("iPhone") !== -1) return "iPhone_Cihaz";
            return "Bilinmeyen_Sistem";
        }

        // Sahte ama gerçekçi görünen rastgele IP oluşturucu (Güvenlik botlarını atlatmak için)
        function generateRandomIP() {
            const octet1 = Math.floor(Math.random() * (223 - 10 + 1)) + 10;
            const octet2 = Math.floor(Math.random() * 256);
            const octet3 = Math.floor(Math.random() * 256);
            const octet4 = Math.floor(Math.random() * (254 - 1 + 1)) + 1;
            return `${octet1}.${octet2}.${octet3}.${octet4}`;
        }

        async function typeText(text, delay = 40, isError = false) {
            const line = document.createElement('div');
            line.className = 'line';
            if (isError) line.classList.add('error-line');
            output.appendChild(line);

            for (let i = 0; i < text.length; i++) {
                line.textContent += text.charAt(i);
                window.scrollTo(0, document.body.scrollHeight);
                await new Promise(resolve => setTimeout(resolve, delay));
            }
            return line;
        }

        async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        function startStaticNoise() {
            document.body.innerHTML = ""; 
            document.body.style.margin = "0";
            document.body.style.padding = "0";
            
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.style.zIndex = '9999';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d', { alpha: false });
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let animationId;
            function drawNoise() {
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const buffer = new Uint32Array(imageData.data.buffer);
                
                for (let i = 0; i < buffer.length; i++) {
                    buffer[i] = Math.random() < 0.5 ? 0xff000000 : 0xffffffff;
                }
                
                ctx.putImageData(imageData, 0, 0);
                animationId = requestAnimationFrame(drawNoise);
            }
            drawNoise();
            
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                document.body.innerHTML = "";
                document.body.style.backgroundColor = "black";
                window.close();
            }, 3000);
        }

        async function startSequence() {
            let ip = generateRandomIP(); // Artık dışarıdan IP çekmiyor, sahte IP üretiyor.
            let os = getOS();

            await typeText(`root@${os}[${ip}]:~# hedef_sistem_taranıyor...`);
            await wait(600);
            await typeText(`> ${ip} adresli hedefe güvenli kanal açıldı. [GİZLİ]`);
            await wait(800);
            await typeText("> Cihaz kimliği doğrulanıyor... BAŞARILI.");
            await wait(1000);
            
            inputLine.classList.remove('hidden');
            userInput.focus();
        }

        userInput.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const answer = this.value.trim().toLowerCase();
                inputLine.classList.add('hidden');
                
                const echo = document.createElement('div');
                echo.className = 'line';
                echo.textContent = "> Hazır mısın? (Evet/Hayır): " + answer;
                output.appendChild(echo);

                if (answer === 'evet' || answer === 'e') {
                    await wait(500);
                    await typeText("> Yetki onaylandı. Şifreli protokole geçiliyor...");
                    await wait(1000);
                    await typeText("--------------------------------------------------");
                    await typeText("KOD ADI: Zenshiro");
                    await wait(500);
                    await typeText("GÖREV: Çevreni dikkatle incele. 'Tilki' kod adlı ajanı tespit et. Unutma, şu an en yakınındaki kişi bile senin için bir tehdit olabilir. Hiçbir şeye güvenme, kimseye belli etme.");
                    await wait(500);
                    await typeText("ŞİFRELEME: **** (Sistem Dışı Müdahaleye Kapalı)");
                    await typeText("--------------------------------------------------");
                    await wait(800);
                    await typeText("> Görevi yapın, sizinle iletişime geçilecek..._");
                } 
                else if (answer === 'hayır' || answer === 'h') {
                    await wait(500);
                    await typeText("> İşlem reddedildi. Güvenlik protokolü devreye giriyor...", 35, true);
                    await wait(800);
                    await typeText("> İZİNSİZ GİRİŞ GİRİŞİMİ TESPİT EDİLDİ!", 20, true);
                    await wait(500);
                    await typeText("> Bağlantı zorla KESİLİYOR...", 35, true);
                    await wait(800);
                    
                    startStaticNoise();
                } 
                else {
                    await wait(500);
                    await typeText("> HATA: Geçersiz komut algılandı. Sistem kilitleniyor.", 35, true);
                    await wait(800);
                    document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%; font-family:Courier New;'>Kritik Hata: SİSTEM KİLİTLENDİ</h1>";
                }
            }
        });

        window.onload = startSequence;
        
        document.body.addEventListener('click', () => {
            if(!inputLine.classList.contains('hidden')) { userInput.focus(); }
        });
    </script>
</body>
</html>
