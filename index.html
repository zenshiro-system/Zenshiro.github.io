<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | Root Access</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            font-size: 16px;
        }
        #terminal {
            max-width: 900px;
            margin: 0 auto;
        }
        .line {
            margin: 5px 0;
            line-height: 1.2;
            text-shadow: 0 0 5px #00ff00;
            word-wrap: break-word;
        }
        .error-line {
            color: #ff3333;
            text-shadow: 0 0 5px #ff0000;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00ff00;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            width: 100%;
            text-shadow: 0 0 5px #00ff00;
            margin-left: 10px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line" class="hidden">
            <span id="prompt-text">> Hazır mısın? (Evet/Hayır): </span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const inputLine = document.getElementById('input-line');
        const userInput = document.getElementById('user-input');

        function getOS() {
            let userAgent = window.navigator.userAgent;
            if (userAgent.indexOf("Windows") !== -1) return "Windows_PC";
            if (userAgent.indexOf("Mac") !== -1) return "MacOS_Makinesi";
            if (userAgent.indexOf("Linux") !== -1) return "Linux_Sistemi";
            if (userAgent.indexOf("Android") !== -1) return "Android_Cihaz";
            if (userAgent.indexOf("iPhone") !== -1) return "iPhone_Cihaz";
            return "Bilinmeyen_Sistem";
        }

        async function typeText(text, delay = 35, isError = false) {
            const line = document.createElement('div');
            line.className = 'line';
            if (isError) line.classList.add('error-line');
            output.appendChild(line);

            for (let i = 0; i < text.length; i++) {
                line.textContent += text.charAt(i);
                window.scrollTo(0, document.body.scrollHeight);
                await new Promise(resolve => setTimeout(resolve, delay));
            }
            return line;
        }

        async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // GERÇEKÇİ KERNEL PANIC (SİSTEM ÇÖKME) EFEKTİ
        function startKernelPanic() {
            document.body.style.backgroundColor = "#000";
            
            let panicInterval = setInterval(() => {
                const line = document.createElement('div');
                line.className = 'line error-line';
                
                // Rastgele Hex (Bellek) kodları üret
                let hexDump = "";
                for(let i=0; i<12; i++) {
                    hexDump += Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase() + " ";
                }
                
                let timeStamp = (Math.random() * 100).toFixed(6);
                let errorTypes = [
                    "KERNEL PANIC - NOT SYNCING: FATAL EXCEPTION",
                    "BUG: unable to handle kernel paging request at",
                    "Oops: 0000 [#1] SMP",
                    "CPU: 0 PID: 1 Comm: init Not tainted",
                    "Hardware name: System manufacturer System Product Name",
                    "RIP: 0010:[<ffffffff81483863>]",
                    "RSP: 0018:ffff88007a8b3e58 EFLAGS: 00000286",
                    "Dumping memory..."
                ];
                let randomMsg = errorTypes[Math.floor(Math.random() * errorTypes.length)];
                
                line.textContent = `[ ${timeStamp}] ${randomMsg} ${hexDump}`;
                output.appendChild(line);
                window.scrollTo(0, document.body.scrollHeight);
            }, 25); // Yazılar inanılmaz hızlı akacak

            // 3.5 saniye sonra ekranı kitle ve çökert
            setTimeout(() => {
                clearInterval(panicInterval);
                document.body.innerHTML = `
                    <div style="color: #ff3333; font-family: 'Courier New', monospace; padding: 20px; font-weight: bold; font-size: 18px; text-shadow: 0 0 5px red;">
                        [CRITICAL] SYSTEM HALTED.<br>
                        [CRITICAL] PHYSICAL MEMORY DUMP COMPLETE.<br>
                        [CRITICAL] UNAUTHORIZED ACCESS DETECTED.<br><br>
                        CONNECTION TERMINATED.
                    </div>
                `;
                // 2 saniye sonra sekmeyi kapatmayı dene
                setTimeout(() => window.close(), 2000);
            }, 3500);
        }

        async function startSequence() {
            let ip = "127.0.0.1";
            let os = getOS();

            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ip = data.ip;
            } catch (error) {
                ip = "IP_Bulunamadi";
            }

            await typeText(`root@${os}[${ip}]:~# hedef_sistem_taranıyor...`);
            await wait(600);
            await typeText(`> ${ip} adresli hedefe güvenli kanal açıldı. [GİZLİ]`);
            await wait(800);
            await typeText("> Cihaz kimliği doğrulanıyor... BAŞARILI.");
            await wait(1000);
            
            inputLine.classList.remove('hidden');
            userInput.focus();
        }

        userInput.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const answer = this.value.trim().toLowerCase();
                inputLine.classList.add('hidden');
                
                const echo = document.createElement('div');
                echo.className = 'line';
                echo.textContent = "> Hazır mısın? (Evet/Hayır): " + answer;
                output.appendChild(echo);

                if (answer === 'evet' || answer === 'e') {
                    await wait(500);
                    await typeText("> Yetki onaylandı. Veritabanına giriş yapılıyor...");
                    await wait(1000);
                    await typeText("--------------------------------------------------");
                    await typeText("SİSTEM İPUCU: Hedef dosyalar güncellendi.");
                    await typeText("Görev: Teo De Luca profilini ve bağlantılarını incele.");
                    await typeText("Şifreleme Türü: SHA-256");
                    await typeText("--------------------------------------------------");
                    await typeText("> Beklemede kalın..._");
                } 
                else if (answer === 'hayır' || answer === 'h') {
                    await wait(500);
                    // Uyarı yazıları kırmızı renkte yazılacak
                    await typeText("> İşlem reddedildi. Güvenlik protokolü devreye giriyor...", 35, true);
                    await wait(800);
                    await typeText("> İZİNSİZ GİRİŞ GİRİŞİMİ TESPİT EDİLDİ!", 20, true);
                    await wait(500);
                    await typeText("> KORUMA PROSEDÜRÜ BAŞLATILIYOR...", 20, true);
                    await wait(800);
                    
                    // GERÇEKÇİ SİSTEM ÇÖKME EFEKTİNİ BAŞLAT
                    startKernelPanic();
                } 
                else {
                    await wait(500);
                    await typeText("> HATA: Geçersiz komut algılandı. Sistem kilitleniyor.", 35, true);
                    await wait(800);
                    document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%; font-family:Courier New;'>Kritik Hata: SİSTEM KİLİTLENDİ</h1>";
                }
            }
        });

        window.onload = startSequence;
        
        document.body.addEventListener('click', () => {
            if(!inputLine.classList.contains('hidden')) { userInput.focus(); }
        });
    </script>
</body>
</html>
